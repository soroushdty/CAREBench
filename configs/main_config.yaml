# Main pipeline configuration
# This is the top-level config file for the pipeline.

# Logging configuration
LOG_LEVEL: DEBUG

# Paths to sub-configs
training_config: configs/training_config.yaml
summary_config: configs/summary_config.yaml

# DATA INPUT AND OUTPUT PATHS
DIR_DATASET: examples/synthetic/dataset.xlsx
TRAIN_SHEET: train
TEST_SHEET: test
INTERVIEW_SHEET: interview
DIR_CONTEXT: examples/synthetic/patient_summaries.json
DIR_JSON_MAP: examples/synthetic/mapping.json
DIR_OUTPUT: output
DIR_SUMMARY: input_summary

# DATASET SCHEMA MAPPINGS
patient_col: Patient
physician_col: Physician
item_col: Item

# LABEL SPACE DEFINITION
# One workbook column per class. Optional `class_definitions` sets a class's
# key (and its Track 3 prompt definition); see docs/adapters.md.
classes:
  - Behavioral health
  - Diagnoses
  - Disabilities
  - Infectious diseases
  - Genetics
  - Medications
  - Sexual and reproductive health
  - Social determinants of health
  - Violence
  - Other

# PREPROCESSING CONTROLS
fuzzy_threshold: 85
physician_count: 2
mismatch_error: false
same_physicians_survey_interview: true

# EMBEDDING MODEL CONFIGURATION
llm: emilyalsentzer/Bio_ClinicalBERT
llm_revision: main
hf_local_files_only: false
tokenizer_model_max_length: 512
# pooling: mean | max | none (first token, [CLS] for BERT) | attention-weighted
#          | simcse | last_token (last non-padding token; use for decoder LLMs)
pooling: mean
# embedding_backend:
#   auto                  → SentenceTransformer when pooling is mean (falls back
#                           to transformers if that fails), transformers otherwise
#   transformers          → AutoModel with the pooling above (use for decoders)
#   sentence_transformers → SentenceTransformer only; the model's own pooling
#                           applies, so pooling must be mean
embedding_backend: auto
# Load the embedding model in float32 | float16 | bfloat16 (null → checkpoint
# default). Half precision is what makes 7B-scale decoders fit in memory.
embedding_dtype: null
# Passed to from_pretrained as device_map (e.g. auto) to spread a large model
# over devices; requires the accelerate package. null → one device.
embedding_device_map: null

# SUMMARY GENERATION CONTROLS
ENABLE_SUMMARY: true
SUMMARY:
  strict: false

# REPRODUCIBILITY GUARDS
REPRODUCIBILITY:
  enforce_pinned_requirements: true
  python_version: ">=3.10"
  allow_remote_inputs: false
  folder_enabled: true
  folder_path: reproducibility_artifacts
  artifacts:
    ensemble_manifest_json: true
    run_manifest_json: true
    run_config_yaml: true
