# backend: huggingface | dry_run | local_transformers
backend: local_transformers
model_ids:
  - "BioMistral/BioMistral-7B-DARE"
  - "google/medgemma-1.5-4b-it"
  - "Qwen/Qwen2.5-14B-Instruct"
  - "epfl-llm/meditron-7b"
  - "wanglab/ClinicalCamel-70B"
  - "microsoft/MediPhi"
  - "openlm-research/open_llama_13b"
local_device_map: "auto"       # or "cuda:0"
local_torch_dtype: "bfloat16"  # bfloat16 | float16 | float32
local_batch_size: 8            # items per GPU forward pass; reduce if OOM

hf_token_env: HF_TOKEN # env var name; or set hf_token directly

temperature: 0.0
# Higher budget required for reasoning models (e.g. MedGemma 1.5 emits a
# pre-answer thinking trace before producing JSON output).
max_tokens: 4096
top_p: 1.0
seed: 42
retry_limit: 3
request_timeout: 60

shuffled_context_seed: 123
bootstrap_seed: 42
permutation_seed: 42

n_bootstrap_resamples: 1000
n_permutations: 10000

# Prompt wording (optional). Defaults shown; change them for a taxonomy that
# is not about privacy. category_type is the word before "categories" in the
# prompt and the reports ("" for none). A changed prompt invalidates the
# matching cached responses, which are then run again.
# prompt:
#   intro: "You are a clinical privacy expert. Classify the following EHR item into privacy categories."
#   category_type: privacy

# Label leakage checking: set to true to skip validation (useful for datasets with known leakage issues)
skip_label_leakage_check: false

output_dir: output/reasoning
cache_dir: output/reasoning/cache
scores_dir: output/reasoning/scores
reports_dir: output/reasoning/reports

data:
  dataset_path: examples/synthetic/dataset.xlsx
  patient_summaries_path: examples/synthetic/patient_summaries.json
  train_sheet: train
  test_sheet: test
  interview_sheet: interview
  patient_col: Patient
  physician_col: Physician
  item_col: Item
  # Output dimensions: one workbook column per class. Classes with these
  # default names get their key and prompt definition from
  # shared/label_space.py. For other classes, add class_definitions:
  #   class_definitions:
  #     Housing: Housing instability or homelessness
  #     Drug therapy: {key: medications, definition: Any prescribed drug}
  classes:
    - Behavioral health
    - Diagnoses
    - Disabilities
    - Infectious diseases
    - Genetics
    - Medications
    - Sexual and reproductive health
    - Social determinants of health
    - Violence
    - Other
