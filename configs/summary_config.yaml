# =============================================================================
# SUMMARY SCOPE AND EXECUTION FLOW
# -----------------------------------------------------------------------------
# Summary generation now uses a fixed, non-configurable layout:
# - raw: train, test, interview, combined
# - standardized: train, test, interview, combined
# - post_physician_merge: train, test, interview, combined
# - final: combined only, plus delta outputs derived from the combined final
#   snapshot
# =============================================================================

# =============================================================================
# OUTPUT FILE SELECTION
# -----------------------------------------------------------------------------
# This block controls which summary artifacts are generated and written.
# Each key directly enables one summary artifact or artifact family.
# =============================================================================
outputs:
  # Write raw-stage item frequency table as CSV.
  item_frequency_raw_csv: true
  # Write standardized-stage item frequency table as CSV.
  item_frequency_standardized_csv: true
  # Write missing-value summary table as CSV.
  missing_csv: true
  runtime_summary_config_json: true
  # Write patient distribution table as CSV.
  patient_distribution_csv: true
  # Write class distribution table as CSV.
  class_distribution_csv: true
  # Render class distribution visualization plot.
  class_distribution_plot: true
  # Write class co-occurrence matrix as CSV.
  class_cooccurrence_csv: true
  # Render class co-occurrence heatmap/plot.
  class_cooccurrence_plot: true
  # Write text-length distribution bins/counts as CSV.
  text_length_csv: true
  # Write per-patient class count profile as CSV.
  per_patient_class_count_csv: true
  # Write per-label patient-positive bucket counts as CSV.
  per_label_patient_positive_buckets_csv: true
  # Write label cardinality tables as CSV.
  label_cardinality_csv: true
  # Write row count per patient as CSV.
  rows_per_patient_csv: true
  # Write labels-per-patient summary table as CSV.
  labels_per_patient_summary_csv: true
  # Write stage-level audit statistics as CSV.
  stage_audit_csv: true
  # Write standardization impact summary as CSV.
  standardization_impact_summary_csv: true
  # Write raw-to-standardized item mapping table as CSV.
  raw_to_standardized_mapping_csv: true
  # Write many-to-one item collapse report as CSV.
  standardization_many_to_one_collapses_csv: true
  # Write raw-stage split overlap report as CSV.
  split_overlap_raw_csv: true
  # Write standardized-stage split overlap report as CSV.
  split_overlap_standardized_csv: true
  # Write post_physician_merge-stage split overlap report as CSV.
  split_overlap_post_physician_merge_csv: true
  # Write grouped multi-row physician cases as CSV.
  physician_multirow_groups_csv: true
  # Write physician disagreement rates as CSV.
  physician_disagreement_rates_csv: true
  # Write conflicting physician group details as CSV.
  physician_conflicting_groups_csv: true
  # Write physician collapse counts as CSV.
  physician_collapse_counts_csv: true
  # Write fractional label audit summary as CSV.
  fractional_label_audit_csv: true
  # Write raw fractional label values as CSV.
  fractional_values_csv: true
  # Write duplicate profile summary as CSV.
  duplicate_profile_csv: true
  # Write duplicate sample-level records as CSV.
  duplicate_samples_csv: true
  # Write consolidated missingness summary workbook (one sheet per stage).
  missingness_summary_xlsx: true
  # Write combined final CSV output.
  final_combined_csv: true
  delta_percentage_per_class_csv: true
  # Write count-per-class delta as CSV.
  delta_count_per_class_csv: true
  delta_percentage_per_stratum_csv: true
  delta_count_per_stratum_csv: true

# =============================================================================
# PLOTTING AND VISUALIZATION PARAMETERS
# -----------------------------------------------------------------------------
# This block configures rendering parameters for charts/figures generated by
# summary outputs.
# =============================================================================
plots:
  # Raster output resolution (dots per inch) for generated plots.
  dpi: 150
  # Figure size in inches [width, height].
  figsize:
    # Plot width in inches.
    - 10
    # Plot height in inches.
    - 6
  # Maximum number of bars/categories shown in top-N bar charts.
  bar_top_n: 50
  # Number of bins for text-length histogram-style charts.
  text_length_bins: 20
  # Maximum labels shown in heatmaps before truncation/sampling.
  heatmap_max_labels: 100

# Strict mode: when true, raise on summary warnings/errors instead of continuing.
strict: false
